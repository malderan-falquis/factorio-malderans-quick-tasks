[mod-setting-description]
fqt-recompute-interval=Minimum game ticks between recalculations of the panel/overlay — the hard rate cap (60 ticks = 1s). At most one check + rebuild per this many ticks no matter how fast inventory/fluids change. Lower = snappier (more CPU on big trees), higher = lower overhead. Default 15 (~4/s).
fqt-max-tree-depth=How deep the recursive component breakdown may go before stopping. Guards against recipe cycles in overhaul mods.
fqt-auto-remove-completed=When a crafting goal is fully satisfied (you have/queued the target amount), remove it from the list automatically. Turn off to keep completed goals shown with a green tick.

